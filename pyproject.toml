[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cricket-algo-trader"
version = "3.0.0"
description = "Cricket Algo-Trading Platform — Multi-format analytical engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.5",
    "duckdb==1.2.1",
    "tqdm==4.67.1",
    "python-dotenv==1.2.2",
    "SQLAlchemy==2.0.36",
]

[project.optional-dependencies]
jupyter = [
    "ipython==9.7.0",
]
api = [
    "fastapi==0.109.2",
    "uvicorn==0.27.0",
    "pydantic==2.6.1",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "config*",
    "formats*",
    "api*",
    "utils*",
    "scripts*",
]
exclude = [
    "tests*",
    "docs*",
    "data_templates*",
    ".venv*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "formats/odi/tests"]
python_files = ["test_*.py", "verify_*.py"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"
